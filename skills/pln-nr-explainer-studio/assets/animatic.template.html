<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}} · Animatic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"PT Sans";font-weight:400;font-style:normal;src:url({{FONT400}}) format("woff2")}
@font-face{font-family:"PT Sans";font-weight:700;font-style:normal;src:url({{FONT700}}) format("woff2")}
/* Ruang review animatic: satu tema gelap navy (layar studio), sudut persegi, sinyal kuning. */
:root{--bg:#05263B;--panel:#0A3551;--line:#1D4E6C;--fg:#EAF4FA;--muted:#9FC3D8;--signal:#FFF100;--navy:#00507C;
  --font:"PT Sans","Myriad Pro","Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--ease:cubic-bezier(.4,0,.2,1);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .wrap{display:flex;align-items:center;gap:18px;padding-block:16px;border-bottom:1px solid var(--line)}
header img{height:30px}
header h1{font-size:20px;margin:0;line-height:1.2}
header .meta{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
main .wrap{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:24px;padding-block:20px 40px}
.viewport{position:relative;width:100%;overflow:hidden;background:#00243A}
.viewport.v{width:auto;max-width:100%;margin:0 auto}
.viewport > .plnnr-stage{transform-origin:0 0;position:absolute!important;left:0;top:0}
.bar{display:flex;gap:2px;margin-top:12px}
.bar button{position:relative;height:30px;border:0;padding:0 6px;background:var(--panel);color:var(--muted);font:700 11px var(--font);text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;min-width:4px}
.bar button b{position:absolute;inset:auto auto 0 0;height:3px;width:0;background:var(--signal)}
.bar button[aria-current="true"]{color:#fff;background:#0F4262}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{background:transparent;border:1px solid var(--fg);color:var(--fg);padding:8px 14px;font:700 14px var(--font);cursor:pointer}
.btn.solid{background:var(--signal);color:var(--navy);border-color:var(--signal)}
.btn:hover{opacity:.86}
.btn:focus-visible,.bar button:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.tc{margin-left:auto;font-family:var(--mono);color:var(--muted)}
aside{background:var(--panel);padding:20px;min-width:0;align-self:start}
aside h2{font-size:22px;margin:4px 0 2px}
aside h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
aside p{margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.data li{margin-bottom:4px}
.data span{color:var(--muted)}
.tbl{overflow-x:auto;grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:28px}
th{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--fg)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.tcol{font-family:var(--mono);color:var(--muted);white-space:nowrap}
tr{cursor:pointer}
tr[aria-current="true"] td{background:#0F4262}
@media(max-width:900px){main .wrap{grid-template-columns:1fr}header .meta{display:none}}
/* mode render: hanya panggung, ukuran piksel persis */
html.render,html.render body{margin:0;background:#000;overflow:hidden}
html.render header,html.render main{display:none}
html.render #renderRoot{display:block}
#renderRoot{display:none;position:fixed;left:0;top:0}
.plnnr-stage{--font:"PT Sans","Myriad Pro","Segoe UI",Helvetica,Arial,sans-serif;--ease:cubic-bezier(.4,0,.2,1)}
{{ANIM_CSS}}
</style>
<style id="rtcss"></style>
</head>
<body>
<header><div class="wrap"><img src="{{LOGO}}" alt="PLN Nusantara Renewables"><div><div class="eyebrow">Animatic · Explainer Studio</div><h1 id="ttl"></h1></div><div class="meta" id="meta"></div></div></header>
<main><div class="wrap">
  <section>
    <div class="viewport" id="viewport"></div>
    <div class="bar" id="bar" role="list"></div>
    <div class="ctl">
      <button class="btn solid" type="button" id="play">Putar</button>
      <button class="btn" type="button" id="prev" aria-label="Adegan sebelumnya">←</button>
      <button class="btn" type="button" id="next" aria-label="Adegan berikutnya">→</button>
      <button class="btn" type="button" id="speed">Kecepatan 1×</button>
      <button class="btn" type="button" id="capBtn" aria-pressed="true">Caption: hidup</button>
      <span class="tc" id="tc">00:00 / 00:00</span>
    </div>
  </section>
  <aside id="info" aria-live="polite"></aside>
  <div class="tbl"><table><thead><tr><th>TC</th><th>#</th><th>Gaya</th><th>Peran</th><th>VO</th><th>Teks layar</th></tr></thead><tbody id="rows"></tbody></table></div>
</div></main>
<div id="renderRoot"></div>
<script>{{STYLES_JS}}</script>
<script>{{RUNTIME_JS}}</script>
<script>
const D = {{DATA}};
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const mmss = t => String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(Math.floor(t % 60)).padStart(2, '0');
  $('#rtcss').textContent = PLNNR_RT.CSS;
  const render = /[?&]render=1/.test(location.search);
  if (render) {
    document.documentElement.classList.add('render');
    const st = document.createElement('div'); $('#renderRoot').append(st);
    const rt = PLNNR_RT.mount(st, D, { captions: !/[?&]captions=0/.test(location.search) });
    window.__meta = { W: rt.W, H: rt.H, total: D.total, scenes: D.scenes.map(s => ({ id: s.id, start: s.start, dur: s.dur })) };
    window.__seek = t => rt.seek(t);
    window.__settle = () => rt.settle();
    document.fonts.ready.then(() => { rt.seek(0); window.__ready = true; });
    return;
  }
  const vp = $('#viewport'), st = document.createElement('div'); vp.append(st);
  const rt = PLNNR_RT.mount(st, D, {});
  if (D.aspect === '9:16') vp.classList.add('v');
  function fit(){ const maxH = Math.min(innerHeight * .72, 760); let w = vp.parentElement.clientWidth; if (D.aspect === '9:16') w = Math.min(w, maxH * rt.W / rt.H); const k = w / rt.W; vp.style.width = w + 'px'; vp.style.height = rt.H * k + 'px'; st.style.transform = `scale(${k})`; }
  addEventListener('resize', fit); fit();
  let t = 0, playing = false, speed = 1, last = 0, cur = -1, caps = true;
  $('#ttl').textContent = D.title;
  $('#meta').innerHTML = esc(D.aspect) + ' · ' + mmss(D.total) + ' · ' + D.scenes.length + ' adegan<br>Pratinjau = frame render final';
  $('#bar').innerHTML = D.scenes.map((s, i) => `<button type="button" role="listitem" data-i="${i}" style="flex:${s.dur} 1 0" title="${esc(s.style)} · ${s.dur} dtk">${s.dur >= D.total * .1 ? esc(s.role) : ''}<b></b></button>`).join('');
  $('#rows').innerHTML = D.scenes.map((s, i) => `<tr data-i="${i}"><td class="tcol">${mmss(s.start)}</td><td>${esc(s.id)}</td><td><b>${esc(s.styleName)}</b></td><td>${esc(s.role)}</td><td>${esc(s.vo)}</td><td>${esc((s.osd || []).join(' / '))}</td></tr>`).join('');
  function info(i){
    const s = D.scenes[i];
    $('#info').innerHTML = `<div class="eyebrow">${esc(s.id)} · ${mmss(s.start)} · ${s.dur} dtk</div><h2>${esc(s.styleName)}</h2><p style="color:var(--muted)">${esc(s.cat)} · masuk dengan ${esc(s.tx)}</p>`
      + (s.vo ? `<h3>VO</h3><p>${esc(s.vo)}</p>` : '')
      + (s.data && s.data.length ? `<h3>Data</h3><ul class="data">${s.data.map(d => `<li>${esc(d.label)}: <b>${esc(d.value)} ${esc(d.unit || '')}</b> <span>· ${esc(d.source)}</span></li>`).join('')}</ul>` : '')
      + `<h3>Arahan visual</h3><p>${esc(s.visual)}</p>` + (s.notes ? `<h3>Catatan</h3><p>${esc(s.notes)}</p>` : '');
    document.querySelectorAll('#bar button').forEach((b, k) => b.setAttribute('aria-current', String(k === i)));
    document.querySelectorAll('#rows tr').forEach((r, k) => r.setAttribute('aria-current', String(k === i)));
  }
  function draw(){
    const i = rt.seek(t); if (i !== cur) { cur = i; info(i); }
    document.querySelectorAll('#bar button b').forEach((b, k) => { const s = D.scenes[k]; b.style.width = Math.max(0, Math.min(1, (t - s.start) / s.dur)) * 100 + '%'; });
    $('#tc').textContent = mmss(t) + ' / ' + mmss(D.total);
  }
  function tick(ts){ const dt = last ? (ts - last) / 1000 : 0; last = ts; if (playing) { t += dt * speed; if (t >= D.total) { t = D.total - .01; setPlay(false); } draw(); } requestAnimationFrame(tick); }
  function setPlay(v){ playing = v; $('#play').textContent = v ? 'Jeda' : 'Putar'; }
  function seek(i){ t = D.scenes[i].start + .01; draw(); }
  $('#play').onclick = () => { if (t >= D.total - .05) t = 0; setPlay(!playing); };
  $('#prev').onclick = () => seek(Math.max(0, rt.idxAt(t) - 1));
  $('#next').onclick = () => seek(Math.min(D.scenes.length - 1, rt.idxAt(t) + 1));
  $('#speed').onclick = () => { speed = speed === 1 ? 2 : 1; $('#speed').textContent = 'Kecepatan ' + speed + '×'; };
  $('#capBtn').onclick = () => { caps = !caps; rt.setCaptions(caps); $('#capBtn').setAttribute('aria-pressed', String(caps)); $('#capBtn').textContent = 'Caption: ' + (caps ? 'hidup' : 'mati'); draw(); };
  $('#bar').onclick = e => { const b = e.target.closest('[data-i]'); if (b) seek(+b.dataset.i); };
  $('#rows').onclick = e => { const r = e.target.closest('[data-i]'); if (r) seek(+r.dataset.i); };
  document.addEventListener('keydown', e => { if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('#play').click(); } if (e.key === 'ArrowRight') $('#next').click(); if (e.key === 'ArrowLeft') $('#prev').click(); });
  document.fonts.ready.then(() => { t = .9; draw(); t = 0; draw(); });
  draw(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
