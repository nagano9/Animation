/* Ruang review animatic: satu tema gelap navy (layar studio), sudut persegi, sinyal kuning. */
:root{--bg:#05263B;--panel:#0A3551;--line:#1D4E6C;--fg:#EAF4FA;--muted:#9FC3D8;--signal:#FFF100;--navy:#00507C;
  --font:"PT Sans","Myriad Pro","Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--ease:cubic-bezier(.4,0,.2,1);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .wrap{display:flex;align-items:center;gap:18px;padding-block:16px;border-bottom:1px solid var(--line)}
header img{height:30px}
header h1{font-size:20px;margin:0;line-height:1.2}
header .meta{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
main .wrap{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:24px;padding-block:20px 40px}
.viewport{position:relative;width:100%;overflow:hidden;background:#00243A}
.viewport.v{width:auto;max-width:100%;margin:0 auto}
.viewport > .plnnr-stage{transform-origin:0 0;position:absolute!important;left:0;top:0}
.bar{display:flex;gap:2px;margin-top:12px}
.bar button{position:relative;height:30px;border:0;padding:0 6px;background:var(--panel);color:var(--muted);font:700 11px var(--font);text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;min-width:4px}
.bar button b{position:absolute;inset:auto auto 0 0;height:3px;width:0;background:var(--signal)}
.bar button[aria-current="true"]{color:#fff;background:#0F4262}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{background:transparent;border:1px solid var(--fg);color:var(--fg);padding:8px 14px;font:700 14px var(--font);cursor:pointer}
.btn.solid{background:var(--signal);color:var(--navy);border-color:var(--signal)}
.btn:hover{opacity:.86}
.btn:focus-visible,.bar button:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.tc{margin-left:auto;font-family:var(--mono);color:var(--muted)}
aside{background:var(--panel);padding:20px;min-width:0;align-self:start}
aside h2{font-size:22px;margin:4px 0 2px}
aside h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
aside p{margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.data li{margin-bottom:4px}
.data span{color:var(--muted)}
.tbl{overflow-x:auto;grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:28px}
th{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--fg)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.tcol{font-family:var(--mono);color:var(--muted);white-space:nowrap}
tr{cursor:pointer}
tr[aria-current="true"] td{background:#0F4262}
@media(max-width:900px){main .wrap{grid-template-columns:1fr}header .meta{display:none}}
/* mode render: hanya panggung, ukuran piksel persis */
html.render,html.render body{margin:0;background:#000;overflow:hidden}
html.render header,html.render main{display:none}
html.render #renderRoot{display:block}
#renderRoot{display:none;position:fixed;left:0;top:0}
.plnnr-stage{--font:"PT Sans","Myriad Pro","Segoe UI",Helvetica,Arial,sans-serif;--ease:cubic-bezier(.4,0,.2,1)}
/* ===== shared animation vocabulary for SVG previews ===== */
.art text{font-family:var(--font)}
.a-spin{animation:aSpin var(--t,6s) linear infinite;transform-box:view-box}
@keyframes aSpin{to{transform:rotate(360deg)}}
.a-draw{stroke-dasharray:var(--len,1000);stroke-dashoffset:0;animation:aDraw var(--t,6s) var(--ease) infinite backwards;animation-delay:var(--d,0s)}
@keyframes aDraw{0%{stroke-dashoffset:var(--len,1000)}45%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.a-flow{stroke-dasharray:var(--dash,6 10);animation:aFlow var(--t,1.2s) linear infinite;animation-delay:var(--d,0s)}
@keyframes aFlow{to{stroke-dashoffset:calc(var(--len,16) * -1)}}
.a-grow{transform-box:fill-box;transform-origin:50% 100%;animation:aGrow var(--t,6s) var(--ease) infinite backwards;animation-delay:var(--d,0s)}
@keyframes aGrow{0%{transform:scaleY(0)}30%,90%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.a-wipe{transform-box:fill-box;transform-origin:0 50%;animation:aWipe var(--t,6s) var(--ease) infinite backwards;animation-delay:var(--d,0s)}
@keyframes aWipe{0%{transform:scaleX(0)}35%,90%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.a-pop{transform-box:fill-box;transform-origin:center;animation:aPop var(--t,6s) cubic-bezier(.16,1,.3,1) infinite backwards;animation-delay:var(--d,0s)}
@keyframes aPop{0%{transform:scale(.2);opacity:0}14%,90%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.a-up{animation:aUp var(--t,6s) cubic-bezier(0,0,.2,1) infinite backwards;animation-delay:var(--d,0s)}
@keyframes aUp{0%{transform:translateY(14px);opacity:0}12%,90%{transform:none;opacity:1}100%{transform:none;opacity:0}}
.a-kin{animation:aKin var(--t,4.5s) cubic-bezier(.16,1,.3,1) infinite backwards;animation-delay:var(--d,0s)}
@keyframes aKin{0%{transform:translateX(-40px);opacity:0}14%,86%{transform:none;opacity:1}100%{transform:translateX(30px);opacity:0}}
.a-pulse{animation:aPulse var(--t,2.4s) ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes aPulse{0%,100%{opacity:.45}50%{opacity:1}}
.a-ping{transform-box:fill-box;transform-origin:center;animation:aPing 2.2s cubic-bezier(0,0,.2,1) infinite;animation-delay:var(--d,0s)}
@keyframes aPing{0%{transform:scale(.6);opacity:.95}100%{transform:scale(2.6);opacity:0}}
.a-float{animation:aFloat var(--t,4s) ease-in-out infinite}
@keyframes aFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--amp,-8px))}}
.a-breathe{transform-box:fill-box;transform-origin:center;animation:aBreathe var(--t,6s) ease-in-out infinite}
@keyframes aBreathe{0%,100%{transform:scale(1)}50%{transform:scale(var(--s,1.05))}}
.a-slide{animation:aSlide var(--t,6s) ease-in-out infinite alternate}
@keyframes aSlide{from{transform:translateX(var(--from,0px))}to{transform:translateX(var(--to,0px))}}
.a-sweepband{animation:aSweep 4.5s var(--ease) infinite}
@keyframes aSweep{0%{transform:translateX(0)}45%,100%{transform:translateX(1000px)}}
.a-push{animation:aPush 6s cubic-bezier(0,0,.2,1) infinite backwards}
@keyframes aPush{0%{transform:translateX(-260px)}14%,90%{transform:none;opacity:1}100%{transform:none;opacity:0}}
.a-wave{animation:aWave var(--t,6s) ease-in-out infinite}
@keyframes aWave{0%,100%{transform:translateY(-18px)}50%{transform:translateY(18px)}}
.a-arc{animation:aArc var(--t,5s) cubic-bezier(.16,1,.3,1) infinite backwards;animation-delay:var(--d,0s)}
@keyframes aArc{0%{stroke-dashoffset:var(--len)}40%,100%{stroke-dashoffset:var(--arc)}}
.a-sway{transform-box:view-box;animation:aSway 5s ease-in-out infinite}
@keyframes aSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.a-steam{transform-box:fill-box;transform-origin:center;animation:aSteam 3.6s ease-out infinite;animation-delay:var(--d,0s)}
@keyframes aSteam{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:.75}100%{transform:translateY(-110px) scale(1.7);opacity:0}}
.a-light{animation:aLight 6s ease-in-out infinite backwards;animation-delay:var(--d,0s)}
@keyframes aLight{0%{opacity:.08}18%,88%{opacity:1}100%{opacity:.08}}
.a-drift{animation:aDrift var(--t,5s) linear infinite;animation-delay:var(--d,0s)}
@keyframes aDrift{0%{transform:translateX(-40px);opacity:0}20%{opacity:.9}80%{opacity:.9}100%{transform:translateX(80px);opacity:0}}
.a-scan{animation:aScan 4s ease-in-out infinite}
@keyframes aScan{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--y,200px))}}
.a-scanx{animation:aScanX 5s linear infinite}
@keyframes aScanX{from{transform:translateX(0)}to{transform:translateX(640px)}}
.a-lid{animation:aLid 6s var(--ease) infinite}
@keyframes aLid{0%,15%{transform:none}35%,80%{transform:translateY(-46px);opacity:.55}100%{transform:none}}
.a-tick{animation:aTick 5s steps(1,end) infinite;animation-delay:var(--d,0s)}
@keyframes aTick{0%{opacity:1}20%,100%{opacity:0}}

</style>

<script>/* PLN NR Motion Gallery — katalog gaya gerak.
   Setiap entri: metadata produksi + fungsi svg(p) yang menghasilkan pratinjau animasi.
   p = prefix id unik (agar gradient tidak bentrok saat SVG yang sama dirender dua kali).
   Seluruh pratinjau adalah ilustrasi orisinal berbasis design system PLN NR, bukan render final. */
(function (root) {
  const C = {
    navy: '#00507C', deep: '#005F89', azure: '#0087BE', sky: '#0098D3', pln: '#009EE2',
    cyan: '#00ADEF', teal: '#00A2BA', green: '#94DA63', lime: '#B9DE41', yellow: '#FFF100',
    paper: '#F1F6FA', white: '#FFFFFF', n25: '#BFD3DE', n50: '#7FA7BD', n75: '#407C9D', inkSoft: '#3A6E8C', line: '#DFDFDF'
  };

  const D = p => `<defs>
<linearGradient id="${p}E" x1="0" x2="1"><stop offset="0" stop-color="#FFF100"/><stop offset=".22" stop-color="#B9DE41"/><stop offset=".52" stop-color="#00A2BA"/><stop offset=".76" stop-color="#00ADEF"/><stop offset="1" stop-color="#005F89"/></linearGradient>
<linearGradient id="${p}V" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00BCC0"/><stop offset=".5" stop-color="#94DA63"/><stop offset="1" stop-color="#FFF100"/></linearGradient>
<linearGradient id="${p}B" x1="0" x2="1"><stop offset="0" stop-color="#00ADEF"/><stop offset=".55" stop-color="#0087BE"/><stop offset="1" stop-color="#005F89"/></linearGradient>
<linearGradient id="${p}N" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#00618F"/><stop offset=".6" stop-color="#00507C"/><stop offset="1" stop-color="#004367"/></linearGradient>
<linearGradient id="${p}C" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#009FDC"/><stop offset=".5" stop-color="#0073A3"/><stop offset="1" stop-color="#00567E"/></linearGradient>
<linearGradient id="${p}S" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#005F89"/><stop offset=".55" stop-color="#00A2BA"/><stop offset=".85" stop-color="#B9DE41"/><stop offset="1" stop-color="#FFF100"/></linearGradient>
</defs>`;

  const svg = (p, body, defs = '') =>
    `<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${D(p)}${defs}${body}</svg>`;

  const hexPts = (cx, cy, r) => [-90, -30, 30, 90, 150, 210]
    .map(a => { const t = a * Math.PI / 180; return `${(cx + r * Math.cos(t)).toFixed(1)},${(cy + r * Math.sin(t)).toFixed(1)}`; }).join(' ');

  const turbine = (x, by, h, c, w = 3, t = '5s') => {
    const hy = by - h, L = h * 0.55;
    const blades = [-90, 30, 150].map(a => {
      const r = a * Math.PI / 180;
      return `<line x1="${x}" y1="${hy}" x2="${(x + L * Math.cos(r)).toFixed(1)}" y2="${(hy + L * Math.sin(r)).toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
    }).join('');
    return `<line x1="${x}" y1="${by}" x2="${x}" y2="${hy}" stroke="${c}" stroke-width="${w * 1.5}" stroke-linecap="round"/><g class="a-spin" style="--t:${t};transform-origin:${x}px ${hy}px">${blades}</g><circle cx="${x}" cy="${hy}" r="${w * 1.3}" fill="${c}"/>`;
  };

  const panel = (x, y, w, h, fill, st) => {
    let g = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="${st}" stroke-width="1.5"/>`;
    for (let i = 1; i < 4; i++) g += `<line x1="${x + w * i / 4}" y1="${y}" x2="${x + w * i / 4}" y2="${y + h}" stroke="${st}" stroke-width=".8"/>`;
    g += `<line x1="${x}" y1="${y + h / 2}" x2="${x + w}" y2="${y + h / 2}" stroke="${st}" stroke-width=".8"/>`;
    return g;
  };

  const person = (x, y, body, helmet = C.yellow, s = 1) =>

<script>/* PLN NR Explainer Studio — runtime render deterministik.
   Setiap frame adalah fungsi murni dari waktu t: semua animasi CSS/WAAPI dan SMIL di-seek,
   bukan diputar. Dipakai bersama oleh animatic (pemutaran interaktif) dan render.mjs (MP4).
   Butuh: window.PLNNR (styles-data.js) dan payload proyek dari build.py. */
(function (root) {
  'use strict';
  const NS = {};

  /* ---------- easing: cubic-bezier numerik ---------- */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t, dx = t => (3 * ax * t + 2 * bx) * t + cx;
    return x => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6 || !d) break; t -= e / d; } return sy(Math.min(1, Math.max(0, t))); };
  }
  const parseBez = css => { const m = String(css || '').match(/[\d.]+/g); return m && m.length === 4 ? bezier(...m.map(Number)) : (x => x); };
  const EASE = { standard: bezier(.4, 0, .2, 1), entrance: bezier(0, 0, .2, 1), emphasis: bezier(.16, 1, .3, 1) };
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  /* Gaya yang bagian bawahnya sudah terisi (lower third, judul peta, letterbox): caption pindah ke atas. */
  /* Gaya yang teksnya sudah tampil besar di dalam art: panel teks bertumpuk tidak mengulanginya. */
  const DISPLAY_TEXT = new Set(['kinetic-type', 'navy-statement', 'energy-sweep', 'vertical-reels']);
  const CAP_TOP = new Set(['lower-third', 'nusantara-map', 'travel-poster', 'wayang-silhouette', 'split-screen', 'hydro-flow', 'geothermal-section']);

  /* ---------- angka Indonesia ---------- */
  function fmtID(n, dec) {
    const s = n.toFixed(dec), [i, f] = s.split('.');
    return i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (f ? ',' + f : '');
  }

  const HEX = k => { const pts = [-90, -30, 30, 90, 150, 210].map(a => { const r = a * Math.PI / 180; return `${50 + 50 * k * Math.cos(r)}% ${50 + 50 * k * Math.sin(r) * 16 / 9}%`; }); return `polygon(${pts.join(',')})`; };

  /* ---------- mount ---------- */
  NS.mount = function (stage, P, opts = {}) {
    const square = P.aspect === '1:1', portrait = P.aspect === '9:16' || square;   // 9:16 dan 1:1 memakai tata letak bertumpuk
    const W = P.aspect === '9:16' || square ? 1080 : 1920, H = P.aspect === '9:16' ? 1920 : 1080;
    const byId = Object.fromEntries(root.PLNNR.STYLES.map(s => [s.id, s]));
    const TX = Object.fromEntries((P.transitions || []).map(t => [t.key, { ms: t.ms, ease: parseBez(t.ease) }]));
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    stage.innerHTML = '';
    Object.assign(stage.style, { position: 'relative', width: W + 'px', height: H + 'px', overflow: 'hidden', background: '#00324F' });
    stage.classList.add('plnnr-stage', square ? 'is-square' : portrait ? 'is-portrait' : 'is-landscape');

    const layers = P.scenes.map((sc, i) => {
      const s = byId[sc.style];
      const L = document.createElement('div'); L.className = 'sc-layer art'; L.style.display = 'none';
      const art = s.svg('s' + i + '_', sc.d || {});
      const textCovered = (s.slots || []).some(k => ['lines', 'title', 'steps', 'name'].includes(k));
      const displayText = DISPLAY_TEXT.has(sc.style);   // teks gaya ini sudah besar di dalam art
      const lines = (sc.osd && sc.osd.length ? sc.osd : (portrait && !displayText ? [sc.d.title, ...(sc.d.lines || sc.d.steps || [])].filter(Boolean) : [])).slice(0, portrait ? 2 : 3);
      if (portrait) {
        L.innerHTML = `<div class="pt-bg"></div><div class="pt-top"><img alt="" src="${P.logo}"></div><div class="pt-art">${art.replace('xMidYMid slice', 'xMidYMid meet')}</div>`
          + `<div class="pt-text">${lines.map(l => `<span>${esc(l)}</span>`).join('')}</div>`;
      } else {
        L.innerHTML = `<div class="ls-art">${art}</div>` + (!textCovered && lines.length ? `<div class="osd">${lines.map(l => `<span>${esc(l)}</span>`).join('')}</div>` : '');
      }
      if (sc.logo) L.insertAdjacentHTML('beforeend', `<div class="lockup"><img alt="Lockup PLN NR" src="${P.logo}"></div>`);
      stage.append(L);
      // animasi masuk overlay sebagai WAAPI agar bisa di-seek
      L.querySelectorAll('.osd span, .pt-text span').forEach((el, k) => el.animate([{ opacity: 0, transform: 'translateY(24px)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: 300 + k * 140, easing: 'cubic-bezier(0,0,.2,1)', fill: 'both' }));
      L.querySelectorAll('.lockup').forEach(el => el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: 1200, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'both' }));
      L.querySelectorAll('[data-count]').forEach(el => { el.dataset.orig = el.textContent; });
      return { el: L, sc, svgs: [...L.querySelectorAll('svg')] };
    });
    const band = document.createElement('div'); band.className = 'tx-band'; stage.append(band);
    const cap = document.createElement('div'); cap.className = 'cap'; stage.append(cap);
    let capsOn = opts.captions !== false;

    function setLocal(ly, local) {
      ly.el.getAnimations({ subtree: true }).forEach(a => { a.pause(); a.currentTime = Math.max(0, local * 1000); });
      ly.svgs.forEach(s => { try { s.pauseAnimations(); s.setCurrentTime(Math.max(0, local)); } catch (e) {} });
      ly.el.querySelectorAll('[data-count]').forEach(el => {
        const n = +el.dataset.count, dec = +el.dataset.dec || 0, k = EASE.emphasis(clamp((local - .35) / .9));
        const suf = (el.dataset.orig || '').replace(/^[\d.,\s]+/, '');

(function(){

  }
  function draw(){
    const i = rt.seek(t); if (i !== cur) { cur = i; info(i); }
    document.querySelectorAll('#bar button b').forEach((b, k) => { const s = D.scenes[k]; b.style.width = Math.max(0, Math.min(1, (t - s.start) / s.dur)) * 100 + '%'; });
    $('#tc').textContent = mmss(t) + ' / ' + mmss(D.total);
  }
  function tick(ts){ const dt = last ? (ts - last) / 1000 : 0; last = ts; if (playing) { t += dt * speed; if (t >= D.total) { t = D.total - .01; setPlay(false); } draw(); } requestAnimationFrame(tick); }
  function setPlay(v){ playing = v; $('#play').textContent = v ? 'Jeda' : 'Putar'; }
  function seek(i){ t = D.scenes[i].start + .01; draw(); }
  $('#play').onclick = () => { if (t >= D.total - .05) t = 0; setPlay(!playing); };
  $('#prev').onclick = () => seek(Math.max(0, rt.idxAt(t) - 1));
  $('#next').onclick = () => seek(Math.min(D.scenes.length - 1, rt.idxAt(t) + 1));
  $('#speed').onclick = () => { speed = speed === 1 ? 2 : 1; $('#speed').textContent = 'Kecepatan ' + speed + '×'; };
